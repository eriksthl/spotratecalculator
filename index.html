<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eriks Spotkalkylator v3.1.0</title>
  <style>
    :root {
      color-scheme: light;
      --border: #878787;
      --border-dark: #222;
      --panel: #eeeeee;
      --panel-dark: #dddddd;
      --muted: #5f5f5f;
      --selected: #fff8c7;
      --total: #fffde8;
      --danger: #9d0000;
      --focus: #1d5f9a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 18px; background: #fff; color: #111; font: 14px/1.35 Arial, Helvetica, sans-serif; }
    header { max-width: 1500px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 21px; font-weight: 600; }
    .version { margin-top: 3px; color: #777; font-size: 11px; font-weight: normal; }
    .route-meta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(95px, .55fr); gap: 10px; padding: 10px; margin: 0 0 12px; border: 1px solid #aaa; background: #fafafa; }
    .route-meta dt { margin-bottom: 3px; color: #5f5f5f; font-size: 11px; }
    .route-meta dd { margin: 0; font-weight: bold; overflow-wrap: anywhere; }
    h2 { margin: 0 0 6px; font-size: 14px; }
    p { margin: 0; }
    main { max-width: 1500px; display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
    main > .card { border: 1px solid var(--border); padding: 10px; background: var(--panel); }
    .card, .field { min-width: 0; }
    label { display: block; margin-bottom: 3px; font-size: 11px; font-weight: bold; }
    textarea, select, input {
      width: 100%; min-height: 31px; padding: 4px 6px; border: 1px solid #777;
      border-radius: 0; background: #fff; color: #111; font: 14px Arial, Helvetica, sans-serif;
    }
    textarea { min-height: 235px; resize: vertical; font: 12px/1.4 Consolas, Monaco, monospace; }
    textarea.is-replaced-by-label { display: none; }
    select { cursor: pointer; }
    select:disabled, input:disabled { background: #ddd; color: #777; }
    input[type="number"] { font-variant-numeric: tabular-nums; }
    button {
      min-height: 29px; padding: 4px 9px; border: 1px solid #777; border-radius: 0;
      background: #eee; color: #111; font: inherit; line-height: 19px; cursor: pointer;
    }
    button:hover { background: #ddd; }
    button:disabled { color: #777; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
    summary:focus-visible, .rate-label:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    #calcBtn { font-weight: bold; border-color: #222; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; margin-top: 12px; }
    .include-field, #clearBtn { grid-column: 1 / -1; }
    .include-panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
    .include-toggle { position: relative; margin: 0; }
    .include-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
    .include-toggle span { display: block; padding: 6px 2px; text-align: center; font-size: 12px; font-weight: normal; border: 1px solid #777; background: #fff; cursor: pointer; }
    .include-toggle input:checked + span { background: var(--selected); border-color: #222; font-weight: bold; }
    .include-toggle input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 1px; }
    .grid { display: grid; gap: 16px; min-width: 0; }
    .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .totalbox { border: 1px solid #aaa; padding: 10px; background: #fafafa; overflow-wrap: anywhere; }
    .totalbox.main { border: 2px solid var(--border-dark); background: var(--total); }
    .totalbox.additional { background: #f5f5f5; }
    .totalbox.excluded { color: #666; }
    .totalbox small { color: var(--muted); display: block; font-size: 12px; margin-bottom: 4px; }
    .totalbox strong { font-size: 14px; font-variant-numeric: tabular-nums; }
    .totalbox.main strong { display: block; font-size: 25px; line-height: 1.2; margin-top: 4px; }
    .note, .compact-note { color: var(--muted); font-size: 11px; margin-top: 6px; overflow-wrap: anywhere; }
    .note:empty, .compact-note:empty { display: none; }
    .status { margin-top: 10px; color: #555; font: 12px/1.35 Consolas, Monaco, monospace; }
    .status:empty { display: none; }
    .status.err, .compact-note.err { color: var(--danger); }
    .status.warn { color: #875700; }
    .table-wrap { overflow: auto; max-height: 600px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .table-wrap table { min-width: 860px; }
    th, td { padding: 6px 8px; border: 1px solid #aaa; text-align: left; vertical-align: middle; }
    th { background: var(--panel); font-size: 12px; white-space: nowrap; }
    .table-wrap th { position: sticky; top: 0; z-index: 1; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tbody tr:hover td { background: #f4f4f4; }
    tr.excluded-row td { color: #777; background: #fafafa; }
    tr.additional-row td { background: #f5f5f5; }
    .pill { font-size: 11px; white-space: nowrap; }
    .status-pill { padding: 2px 6px; min-height: 25px; line-height: 19px; background: var(--selected); }
    .status-pill.additional { background: #eee; }
    .status-pill.excluded { color: #666; background: #f5f5f5; }
    .status-pill.manual { border-style: dashed; }
    .footer-actions, .rates-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .rate-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-height: 240px; overflow: auto; margin-top: 8px; padding: 2px; }
    .rate-grid label { font-size: 10px; }
    .rate-grid input { font-size: 12px; }
    details { border: 1px solid #aaa; background: #fafafa; }
    summary { padding: 7px 9px; background: #eee; cursor: pointer; font-weight: bold; font-size: 12px; }
    details.rates-panel { margin-top: 12px; }
    .rates-panel > :not(summary) { margin-left: 8px; margin-right: 8px; }
    .rates-panel .compact-note { margin-bottom: 8px; }
    .rate-label { display: none; padding: 8px; border: 1px solid #777; background: var(--selected); font-size: 12px; font-weight: bold; cursor: pointer; overflow-wrap: anywhere; }
    .rate-label.is-visible { display: block; }
    .note-field { margin-top: 14px; }
    #rateNote { min-height: 76px; font: 13px/1.4 Arial, Helvetica, sans-serif; }
    .history-panel { grid-column: 1 / -1; min-width: 0; }
    #historyCount { margin-left: 6px; font-weight: normal; color: #555; }
    #historyStatus:not(:empty) { padding: 2px 9px 8px; }
    .history-table-wrap { max-height: 360px; overflow: auto; }
    .history-table { min-width: 1050px; }
    .history-table th { position: sticky; top: 0; z-index: 1; }
    .history-table td { background: #fff; }
    .history-table tr.is-active td { background: var(--selected); }
    .history-table time { white-space: nowrap; }
    .history-note { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 350px; }
    .history-total { white-space: pre-line; font-variant-numeric: tabular-nums; }
    .history-table td:last-child { width: 70px; }
    @media (max-width: 1080px) {
      main { grid-template-columns: 1fr; }
      .table-wrap { max-height: none; }
    }
    @media (max-width: 640px) {
      body { margin: 12px; }
      h1 { font-size: 20px; }
      .totals { grid-template-columns: 1fr 1fr; }
      .totalbox.main { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Eriks Spotkalkylator</h1>
    <div class="version">v3.1.0</div>
  </header>

  <main>
    <section class="card">
      <label for="input">Pristext</label>
      <textarea id="input" placeholder="Klistra in från MSC, Hapag-Lloyd, Maersk eller OOCL..."></textarea>
      <div id="rateLabel" class="rate-label" role="button" tabindex="0" title="Klicka för att visa den inklistrade texten"></div>
      <div class="controls">
        <div class="field include-field">
          <label>Inkludera i huvudsumma</label>
          <div class="include-panel" role="group" aria-label="Inkludera kostnadsgrupper">
            <label class="include-toggle"><input id="includeFreight" type="checkbox" checked><span>Freight</span></label>
            <label class="include-toggle"><input id="includeOrigin" type="checkbox" checked><span>Origin</span></label>
            <label class="include-toggle"><input id="includeDestination" type="checkbox"><span>Destination</span></label>
          </div>
        </div>
        <div class="field">
          <label for="containerType">Containertyp</label>
          <select id="containerType">
            <option value="20STD">20STD</option>
            <option value="40STD">40STD</option>
            <option value="40HC" selected>40HC</option>
            <option value="ALL">Alla</option>
          </select>
        </div>
        <div class="field">
          <label for="equipmentQty">Containers</label>
          <input id="equipmentQty" type="number" min="1" step="1" value="1" />
        </div>
        <div class="field small">
          <label for="blQty">B/L</label>
          <input id="blQty" type="number" min="1" step="1" value="1" />
        </div>
        <button id="calcBtn">Räkna ut</button>
        <button id="clearBtn" class="secondary">Rensa</button>
      </div>

      <div class="note-field">
        <label for="rateNote">Note</label>
        <textarea id="rateNote" rows="3"></textarea>
        <div id="saveStatus" class="compact-note" role="status"></div>
      </div>

      <details class="rates-panel">
        <summary>ROE</summary>
        <div class="rates-actions">
          <button id="ratesBtn" class="secondary">Hämta ROE</button>
        </div>
        <div id="rateGrid" class="rate-grid"></div>
        <div id="rateMeta" class="compact-note"></div>
      </details>

      <div id="status" class="status" role="status"></div>
    </section>

    <section class="grid">
      <div class="card span-4">
        <dl id="routeMeta" class="route-meta">
          <div><dt>POL</dt><dd id="polValue">—</dd></div>
          <div><dt>POD</dt><dd id="podValue">—</dd></div>
          <div><dt>Transit</dt><dd id="transitValue">—</dd></div>
        </dl>
        <h2>Summa</h2>
        <div id="totals" class="totals"><p class="note"></p></div>
      </div>
      <div class="card span-8">
        <h2>Tolkade rader</h2>
        <div id="table" class="table-wrap"><table><tbody><tr><td></td></tr></tbody></table></div>
        <div class="footer-actions">
          <button id="copyCsvBtn" class="secondary">Kopiera CSV</button>
        </div>
      </div>
    </section>
    <details id="historyPanel" class="history-panel" open>
      <summary>Historik <span id="historyCount">0</span></summary>
      <div id="historyStatus" class="compact-note" role="status"></div>
      <div class="history-table-wrap">
        <table class="history-table">
          <thead><tr><th>Datum / tid</th><th>Rate</th><th>POL</th><th>POD</th><th>Equipment</th><th>Antal</th><th>Transit</th><th>Huvudsumma</th><th>Note</th><th></th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </details>
  </main>

<script>
(function () {
  const input = document.getElementById('input');
  const statusEl = document.getElementById('status');
  const totalsEl = document.getElementById('totals');
  const tableEl = document.getElementById('table');
  const calcBtn = document.getElementById('calcBtn');
  const ratesBtn = document.getElementById('ratesBtn');
  const clearBtn = document.getElementById('clearBtn');
  const copyCsvBtn = document.getElementById('copyCsvBtn');
  const containerTypeEl = document.getElementById('containerType');
  const equipmentQtyEl = document.getElementById('equipmentQty');
  const blQtyEl = document.getElementById('blQty');
  const includeFreightEl = document.getElementById('includeFreight');
  const includeOriginEl = document.getElementById('includeOrigin');
  const includeDestinationEl = document.getElementById('includeDestination');
  const rateGridEl = document.getElementById('rateGrid');
  const rateMetaEl = document.getElementById('rateMeta');
  const rateLabelEl = document.getElementById('rateLabel');
  const rateNoteEl = document.getElementById('rateNote');
  const saveStatusEl = document.getElementById('saveStatus');
  const historyBodyEl = document.getElementById('historyBody');
  const historyCountEl = document.getElementById('historyCount');
  const historyStatusEl = document.getElementById('historyStatus');
  const polValueEl = document.getElementById('polValue');
  const podValueEl = document.getElementById('podValue');
  const transitValueEl = document.getElementById('transitValue');
  const rateInputs = {};

  const HISTORY_KEY = 'erik.spotCalculator.history.v1';
  let historyEntries = [];
  let activeCheckId = null;
  let activeCheckText = '';
  let ratesRevision = 0;
  let ratesController = null;
  let currentMetadata = { pol: '', pod: '', transitDays: null };
  const metadataCache = new Map();

  let currentRows = [];
  let lastFormat = '';
  let manualBucketOverrides = {};
  let lastInputForOverrides = '';
  const supportedPayments = 'Prepaid, Collect, Elsewhere';
  const isoCurrencies = ['SEK','USD','EUR','GBP','AED','NOK','DKK','CHF','CNY','JPY','HKD','SGD','AUD','NZD','CAD','MXN','BRL','INR','IDR','THB','MYR','KRW','TWD','ZAR','TRY','PLN','CZK','HUF','RON','BGN','HRK','RSD','SAR','QAR','KWD','BHD','OMR','ILS','EGP','MAD','NGN','KES','PKR','BDT','VND','PHP','CLP','COP','PEN','ARS'];
  const currencies = new Set(isoCurrencies);
  const categoriesFormat1 = new Set(['Freight Charge', 'Freight Surcharges', 'Export Surcharges', 'Import Surcharges']);
  const skipLinesF1 = new Set(['Charges', 'Charge', 'Charge Level', 'Amount', 'Supported Payments', 'Comments & Conditions']);
  const defaultRatesToSek = {
    SEK: 1, USD: 10.5000, EUR: 11.5000, GBP: 13.5000, AED: 2.8600,
    NOK: 0.9800, DKK: 1.5400, CHF: 12.1000, CNY: 1.4500, JPY: 0.0720,
    HKD: 1.3400, SGD: 7.8000, AUD: 6.9000, NZD: 6.3000, CAD: 7.7000,
    MXN: 0.5700, BRL: 1.9500, INR: 0.1260, IDR: 0.00065, THB: 0.2860,
    MYR: 2.2300, KRW: 0.0077, TWD: 0.3200, ZAR: 0.5700, TRY: 0.3200,
    PLN: 2.7000, CZK: 0.4700, HUF: 0.0290, RON: 2.3100, BGN: 5.8800,
    HRK: 1.5300, RSD: 0.0980, SAR: 2.8000, QAR: 2.8800, KWD: 34.2000,
    BHD: 27.9000, OMR: 27.3000, ILS: 2.8500, EGP: 0.2100, MAD: 1.0500,
    NGN: 0.0068, KES: 0.0810, PKR: 0.0380, BDT: 0.0860, VND: 0.00041,
    PHP: 0.1800, CLP: 0.0110, COP: 0.0027, PEN: 2.8500, ARS: 0.0090
  };


  function normalizePastedText(text) {
    const clean = value => String(value).replace(/\[([^\]]+)\]\([^\n]*?\)/g, '$1')
      .replace(/\*\*/g, '').replace(/^\s*#{1,6}\s+/, '').replace(/\u00a0/g, ' ').trim();
    return String(text || '').split('\n').flatMap(raw => {
      const pipeTable = /^\s*\|.*\|\s*$/.test(raw);
      const line = clean(raw);
      if (/^-{3,}$/.test(line)) return [];
      if (!pipeTable && !line.includes('\t')) return [line.replace(/^(Freight|Origin|Destination) charges(?=Basis)/i, '$1 charges\n')];
      const cells = (pipeTable ? raw.trim().slice(1, -1).split('|') : line.split('\t')).map(clean).filter(Boolean);
      if (pipeTable && cells.every(cell => /^:?-+:?$/.test(cell))) return [];
      const unit = cells.findIndex(cell => /^(Ctr\.|BL)$/.test(cell));
      if (unit >= 0 && /^[A-Z]{3}$/.test(cells[unit + 1] || '')) {
        return [...cells.slice(0, unit + 2), cells.slice(unit + 2).join('\t')];
      }
      const maerskRow = /^(Container|Bill of Lading)$/i.test(cells[1] || '');
      const maerskHeader = /^(Freight|Origin|Destination) charges|^Basis/i.test(cells[0] || '');
      if (maerskRow || maerskHeader) return cells.map(cell => cell.replace(/^(Freight|Origin|Destination) charges(?=Basis)/i, '$1 charges\n'));
      // OOCL and existing Hapag price triples retain their tab-separated columns.
      return [pipeTable ? cells.join('\t') : line];
    }).join('\n');
  }

  function cleanLines(text) {
    return String(text || '')
      .replace(/\r/g, '')
      .split('\n')
      .map(s => s.replace(/\u00a0/g, ' ').trim())
      .filter(Boolean);
  }

  function parseMoneyLine(line) {
    const m = line.match(/^(-?\d+(?:[.,]\d+)?)\s*([A-Z]{3})$/i);
    if (!m) return null;
    return { amount: Number(m[1].replace(',', '.')), currency: m[2].toUpperCase() };
  }

  function normalizeChargeName(name) {
    return name
      .replace(/\[([^\]]+)\]/g, '($1)')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function isLikelyComment(line) {
    return /\.$/.test(line) || /booking|shipping|manual|surcharge may|routing|subject to change|applicable|paid collect|to be paid/i.test(line);
  }

  function parseFormat1(lines) {
    const rows = [];
    let category = '';
    let i = 0;
    while (i < lines.length) {
      let line = lines[i];
      if (skipLinesF1.has(line)) { i++; continue; }
      if (categoriesFormat1.has(line)) { category = line; i++; continue; }

      const charge = line;
      const level = lines[i + 1] || '';
      const money = parseMoneyLine(lines[i + 2] || '');
      const payments = lines[i + 3] || '';
      if (!category || !/^Per\s/i.test(level) || !money || !/Prepaid|Collect|Elsewhere/i.test(payments)) {
        i++;
        continue;
      }
      let comment = '';
      let j = i + 4;
      while (j < lines.length && !categoriesFormat1.has(lines[j])) {
        if (skipLinesF1.has(lines[j])) { j++; continue; }
        const nextLooksLikeCharge = /^Per\s/i.test(lines[j + 1] || '') && parseMoneyLine(lines[j + 2] || '');
        if (nextLooksLikeCharge) break;
        if (isLikelyComment(lines[j]) || !/^Per\s/i.test(lines[j])) comment += (comment ? ' ' : '') + lines[j];
        j++;
      }
      rows.push({
        format: 'MSC',
        category,
        charge: normalizeChargeName(charge),
        level,
        currency: money.currency,
        amount: money.amount,
        amount20: money.amount,
        amount40: money.amount,
        amount40hc: money.amount,
        payment: payments,
        comment,
        unit: /bill of lading/i.test(level) ? 'BL' : 'Ctr.'
      });
      i = j;
    }
    return rows;
  }

  function lineIsCurrency(line) { return /^[A-Z]{3}$/i.test(String(line || '').trim()); }
  function lineIsUnit(line) { return /^(Ctr\.|BL|Container|Per Container)$/i.test(line); }
  function lineIsPrice(line) { return /\d/.test(line) && (/(ctr\. type irrelevant)/i.test(line) || /\t/.test(line) || /^\d/.test(line)); }
  function parsePriceTriple(line) {
    const irrelevant = /ctr\. type irrelevant/i.test(line);
    const nums = (line.match(/-?\d+(?:[.,]\d+)?/g) || []).map(x => Number(x.replace(',', '.')));
    if (!nums.length) return null;
    if (irrelevant || nums.length === 1) return { amount20: nums[0], amount40: nums[0], amount40hc: nums[0], irrelevant };
    return { amount20: nums[0], amount40: nums[1] ?? nums[0], amount40hc: nums[2] ?? nums[1] ?? nums[0], irrelevant: false };
  }

  function sliceHapagRateSection(lines) {
    const freightStarts = [];
    lines.forEach((line, idx) => {
      if (/^Freight Charges$/i.test(line)) freightStarts.push(idx);
    });
    let start = freightStarts[0] ?? -1;
    const detailIdx = lines.findIndex(line => /^Show Total Price Estimate Details$/i.test(line));
    if (detailIdx >= 0) {
      const afterDetail = freightStarts.find(idx => idx > detailIdx);
      if (afterDetail !== undefined) start = afterDetail;
    }
    if (start < 0) return lines;

    let end = lines.length;
    for (let i = start + 1; i < lines.length; i++) {
      if (/^Quick Quotes$/i.test(lines[i]) || /^Container Group$/i.test(lines[i]) || /^Services & Information$/i.test(lines[i])) {
        end = i;
        break;
      }
    }
    return lines.slice(start, end);
  }

  function isHapagTransportAdditionalOrigin(charge) {
    return /^Transport\s+Additional\s+Orig(?:in)?\b/i.test(String(charge || '').trim());
  }

  function classifyFormat2Charge(charge, collectFlag) {
    const c = String(charge || '');
    if (/^Ocean Freight$/i.test(c)) return 'Freight Charge';
    if (isHapagTransportAdditionalOrigin(c)) return 'Freight Surcharge';
    if (/Document Charge/i.test(c) && !/Destination Documentation/i.test(c)) return 'Export Surcharge';
    if (/(Origin|Orig\.?)/i.test(c) && /Emergency Ops|THC|Terminal|Handling|Additional/i.test(c)) return 'Export Surcharge';
    if (collectFlag || /Destination|Dest\.?|Cargo Release|Equipment Transfer|Receiving,?\s*Handling,?\s*Delivery|Equipment Maintenance|Electronic Payment Processing|Preparing Delivery Order/i.test(c)) return 'Import Surcharge';
    return 'Freight Surcharge';
  }

  function normalizeFormat2ChargeName(charge) {
    let c = String(charge || '').trim();
    c = c.replace(/\s*\(all in one document\)\s*/i, '').trim();
    const heavy = c.match(/^Between\s+([\d.,]+)\s+and\s+([\d.,]+)\s+ton\s+container\s+gross\s+weight\s*\(?VGM\)?/i);
    if (heavy) return `Heavy Lift Charge (VGM ${heavy[1].replace('.', ',')}–${heavy[2].replace('.', ',')} ton)`;
    c = c.replace(/\bDest\.?$/i, 'Destination');
    return c;
  }

  function collectOceanFreightComment(lines, startIndex) {
    for (let k = startIndex; k < Math.min(lines.length, startIndex + 6); k++) {
      if (/^The Ocean Freight includes/i.test(lines[k] || '')) {
        const parts = [];
        for (let m = k + 1; m < lines.length; m++) {
          const line = lines[m];
          if (/^Surcharges$/i.test(line) || lineIsUnit(line) || lineIsCurrency(line) || lineIsPrice(line)) break;
          if (/^Show Prices In$|^Local Currency$|^Unless otherwise/i.test(line)) break;
          if (line && !/^The Ocean Freight includes/i.test(line)) parts.push(line.replace(/\.$/, ''));
        }
        if (parts.length) return 'Inkl. ' + parts.join(', ') + '.';
      }
      if (/^Surcharges$/i.test(lines[k] || '')) break;
    }
    return '';
  }

  function parseFormat2(lines) {
    lines = sliceHapagRateSection(lines);
    const rows = [];
    const stopOrNoise = /^(Freight Charges|Surcharges|Show Prices In|Local Currency|Unless otherwise|The Ocean Freight includes|Carrier Security Fee|Emergency Surcharge|Operations Cost Recovery|Terminal Handling Charge Orig\.?|Suez Canal Transit Charge\.?)/i;
    let pendingComment = '';
    let collectFlag = false;
    let forceImportAfterDocumentCharge = false;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const looksLikeStructuredCharge = lineIsUnit(lines[i + 1] || '') && lineIsCurrency(lines[i + 2] || '') && parsePriceTriple(lines[i + 3] || '');
      if (/^Freight Charges$/i.test(line) || /^Surcharges$/i.test(line)) continue;
      if (/^The Ocean Freight includes/i.test(line)) continue;
      if (/^Show Prices In$|^Local Currency$|^Unless otherwise/i.test(line)) continue;
      if (/^Applicable if shipping instructions/i.test(line)) { pendingComment = 'Gäller om shipping instructions mottagits via eChannel'; continue; }
      if (/^To be paid collect$/i.test(line)) { collectFlag = true; continue; }
      if (/^To be paid prepaid$/i.test(line)) continue;
      if ((stopOrNoise.test(line) && !looksLikeStructuredCharge) || lineIsUnit(line) || lineIsCurrency(line) || lineIsPrice(line)) continue;

      let originalCharge = line;
      const embeddedPrepaid = /\(\s*To be paid prepaid\s*\)/i.test(originalCharge);
      if (embeddedPrepaid) originalCharge = originalCharge.replace(/\s*\(\s*To be paid prepaid\s*\)\s*/i, ' ').trim();
      const charge = normalizeFormat2ChargeName(originalCharge);
      const isDocumentCharge = /^Document Charge$/i.test(charge);
      const forceImportForThisRow = forceImportAfterDocumentCharge && !isDocumentCharge;
      let j = i + 1;
      let comment = pendingComment;
      pendingComment = '';
      if (embeddedPrepaid) comment = comment ? comment + ', betalas prepaid' : 'Betalas prepaid';
      let scanningChargeMeta = true;
      while (scanningChargeMeta) {
        if (/^Applicable if shipping instructions/i.test(lines[j] || '')) {
          comment = comment ? comment + ', gäller om shipping instructions mottagits via eChannel' : 'Gäller om shipping instructions mottagits via eChannel';
          j++;
          continue;
        }
        if (/^To be paid collect$/i.test(lines[j] || '')) {
          collectFlag = true;
          j++;
          continue;
        }
        if (/^To be paid prepaid$/i.test(lines[j] || '')) {
          comment = comment ? comment + ', betalas prepaid' : 'Betalas prepaid';
          j++;
          continue;
        }
        scanningChargeMeta = false;
      }
      const unit = lines[j] || '';
      const currency = (lines[j + 1] || '').toUpperCase();
      const prices = parsePriceTriple(lines[j + 2] || '');
      if (!lineIsUnit(unit) || !lineIsCurrency(currency) || !prices) continue;

      if (/^Ocean Freight$/i.test(charge)) {
        comment = collectOceanFreightComment(lines, j + 3) || comment;
      }
      if (/Heavy Lift Charge/i.test(charge)) {
        if (prices.amount20 === prices.amount40 && prices.amount40 === prices.amount40hc) {
          prices.amount40 = 0;
          prices.amount40hc = 0;
        }
        comment = comment ? comment + ', endast för 20STD' : 'Endast för 20STD';
      }
      if (collectFlag) comment = comment ? comment + ', betalas collect' : 'Betalas collect';
      if (prices.irrelevant) comment = comment ? comment + ', containertyp irrelevant' : 'Containertyp irrelevant';

      rows.push({
        format: 'Hapag-Lloyd',
        category: isHapagTransportAdditionalOrigin(charge) ? 'Freight Surcharge'
          : forceImportForThisRow ? 'Import Surcharge' : classifyFormat2Charge(charge, collectFlag),
        charge,
        level: unit,
        unit,
        currency,
        amount20: prices.amount20,
        amount40: prices.amount40,
        amount40hc: prices.amount40hc,
        amount: prices.amount40hc,
        payment: collectFlag ? 'Collect' : '',
        comment
      });
      if (isDocumentCharge) {
        forceImportAfterDocumentCharge = true;
      }
      collectFlag = false;
      i = j + 2;
    }
    return rows;
  }



  function parseOOCLNumber(value) {
    let s = String(value || '').trim().replace(/\s/g, '');
    if (!s) return null;
    if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) {
      s = s.replace(/,/g, '');
    } else if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(',', '.');
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function stripOOCLTrailingClass(tailCells) {
    const cells = tailCells.map(c => String(c || '').trim()).filter(Boolean);
    let suppliedClass = '';
    if (cells.length && /^(Origin|Destination|Additional(?:\s+doc\s+fee)?|Freight)$/i.test(cells[cells.length - 1])) {
      suppliedClass = cells.pop();
    }
    return {
      remarks: cells.join(' ').replace(/\s+/g, ' ').trim(),
      suppliedClass
    };
  }

  function classifyFormat4Charge(charge, remarks, section) {
    const c = String(charge || '');
    const r = String(remarks || '').trim();
    if (section === 'freight') return 'Freight Charge';
    if (/^Outbound\s+Documentation\s+Fee$/i.test(c)) return 'Additional';
    if (/Advance\s+Manifest\s+Security\s+Charge/i.test(c)) return 'Export Surcharge';
    if (/Origins?/i.test(r) || !r || /^Tariff\.?$/i.test(r) || /^Tariff;?\s*$/i.test(r)) return 'Export Surcharge';
    if (/Destinations?|Last\s+Discharge/i.test(r)) return 'Import Surcharge';
    return 'Export Surcharge';
  }

  function parseFormat4(lines) {
    const rows = [];
    let section = '';

    lines.forEach(line => {
      if (/^Ocean\s+Freight\s*:/i.test(line)) { section = 'freight'; return; }
      if (/^Ocean\s+Surcharges\s*:/i.test(line)) { section = 'surcharges'; return; }
      if (/\bCode\b/i.test(line) && /\bCurrency\b/i.test(line) && /\bPer\s*20ft\b/i.test(line)) return;
      if (!/\b[A-Z]{3}\b/.test(line) || !/\d/.test(line)) return;

      const cells = String(line || '')
        .split('\t')
        .map(s => s.replace(/\u00a0/g, ' ').trim())
        .filter(Boolean);
      if (cells.length < 5) return;

      let curIdx = -1;
      for (let idx = 0; idx <= cells.length - 4; idx++) {
        const maybeCurrency = String(cells[idx] || '').trim().toUpperCase();
        if (!currencies.has(maybeCurrency)) continue;
        if (parseOOCLNumber(cells[idx + 1]) !== null && parseOOCLNumber(cells[idx + 2]) !== null && parseOOCLNumber(cells[idx + 3]) !== null) {
          curIdx = idx;
          break;
        }
      }
      if (curIdx < 1) return;

      const currency = cells[curIdx].toUpperCase();
      const amount20 = parseOOCLNumber(cells[curIdx + 1]);
      const amount40 = parseOOCLNumber(cells[curIdx + 2]);
      const amount40hc = parseOOCLNumber(cells[curIdx + 3]);

      let code = '';
      let chargeCells;
      if (curIdx >= 2 && /^[A-Z0-9]{2,6}$/i.test(cells[curIdx - 1]) && !/[.,:;]/.test(cells[curIdx - 1])) {
        code = cells[curIdx - 1].toUpperCase();
        chargeCells = cells.slice(0, curIdx - 1);
      } else {
        chargeCells = cells.slice(0, curIdx);
      }
      const charge = normalizeChargeName(chargeCells.join(' '));
      if (!charge) return;

      const tail = stripOOCLTrailingClass(cells.slice(curIdx + 4));
      const category = classifyFormat4Charge(charge, tail.remarks, section);
      const isBl = /Per\s*B\/L/i.test(tail.remarks);
      const comment = [code, tail.remarks].filter(Boolean).join(' | ');

      rows.push({
        format: 'OOCL',
        category,
        charge,
        level: isBl ? 'Per Bill of Lading' : 'Per Container',
        unit: isBl ? 'BL' : 'Ctr.',
        currency,
        amount20,
        amount40,
        amount40hc,
        amount: amount40hc,
        payment: '',
        comment
      });
    });
    return rows;
  }

  function parsePlainNumber(line) {
    const m = String(line || '').trim().match(/^-?\d+(?:[.,]\d+)?$/);
    return m ? Number(m[0].replace(',', '.')) : null;
  }

  function normalizeMaerskCategory(line) {
    const l = String(line || '').trim();
    if (/^Freight charges\b/i.test(l)) return 'Freight charges';
    if (/^Origin charges\b/i.test(l)) return 'Origin charges';
    if (/^Destination charges\b/i.test(l)) return 'Destination charges';
    return '';
  }

  function isMaerskHeaderOrNoise(line) {
    const l = String(line || '').trim();
    return /^(Basis|Quantity|Currency|Unit price|Total price)$/i.test(l)
      || /^Basis\s+Quantity\s+Currency\s+Unit price\s+Total price$/i.test(l)
      || /^Basis\tQuantity\tCurrency\tUnit price\tTotal price$/i.test(l);
  }

  function parseFormat3(lines) {
    const rows = [];
    let category = '';
    for (let i = 0; i < lines.length; i++) {
      const cat = normalizeMaerskCategory(lines[i]);
      if (cat) { category = cat; continue; }
      if (!category || isMaerskHeaderOrNoise(lines[i])) continue;

      const charge = normalizeChargeName(lines[i]);
      const basis = lines[i + 1] || '';
      const qty = parsePlainNumber(lines[i + 2] || '');
      const currency = (lines[i + 3] || '').toUpperCase();
      const unitPrice = parsePlainNumber(lines[i + 4] || '');
      const totalPrice = parsePlainNumber(lines[i + 5] || '');

      if (!/^(Container|Bill of Lading)$/i.test(basis) || qty === null || !lineIsCurrency(currency) || unitPrice === null || totalPrice === null) continue;

      rows.push({
        format: 'Maersk',
        category,
        charge,
        level: basis,
        unit: /bill of lading/i.test(basis) ? 'BL' : 'Ctr.',
        currency,
        amount20: unitPrice,
        amount40: unitPrice,
        amount40hc: unitPrice,
        amount: unitPrice,
        sourceQty: qty,
        sourceTotal: totalPrice,
        payment: '',
        comment: ''
      });
      i += 5;
    }
    return rows;
  }

  function normalizeContainerType(raw) {
    const value = String(raw || '').toUpperCase().replace(/["']/g, '').replace(/\s+/g, ' ').trim();
    if (/40\s*(HC|HQ|HIGH\s*CUBE|DRY\s*HIGH)/i.test(value) || /^40HC$/i.test(value)) return '40HC';
    if (/40\s*(DV|STD|DRY\s*VAN|DRY\s*STANDARD)/i.test(value) || /^40DV$/i.test(value)) return '40STD';
    if (/20\s*(DV|STD|DRY\s*VAN|DRY\s*STANDARD)/i.test(value) || /^20DV$/i.test(value)) return '20STD';
    return '';
  }

  function detectMaerskContainerType(lines) {
    const joined = lines.join(' ').replace(/\s+/g, ' ');
    const m = joined.match(/\b\d+\s*[x×]\s*(20|40)\s*Dry\s*(High|Standard)\b/i);
    if (!m) return '';
    if (m[1] === '40' && /High/i.test(m[2])) return '40HC';
    if (m[1] === '40') return '40STD';
    return '20STD';
  }

  function selectedMscEquipment(lines) {
    // The search header lists every available type; only a single, explicit type is a selection.
    for (let i = lines.length - 1; i >= 0; i--) {
      const match = lines[i].match(/^Equipment\s*type\s*:\s*(.*)$/i);
      if (!match && !/^Equipment\s*type$/i.test(lines[i])) continue;
      const raw = (match?.[1] || lines[i + 1] || '').replace(/["'’]/g, '').trim();
      if (!/^(?:20|40)\s*(?:DV|STD|HC|HQ|Dry\s+Van|Dry\s+Standard|Dry\s+High|High\s+Cube)$/i.test(raw)) continue;
      const type = normalizeContainerType(raw);
      if (type) return { type, index: i };
    }
    return { type: '', index: -1 };
  }

  function detectMscContainerType(lines) {
    return selectedMscEquipment(lines).type;
  }

  function labeledValue(lines, pattern) {
    for (let i = 0; i < lines.length; i++) {
      const match = lines[i].match(pattern);
      if (match) return (match[1] || lines[i + 1] || '').trim();
    }
    return '';
  }

  function transitDaysFromValue(value) {
    const text = String(value || '').trim();
    if (/^\d+(?:[.,]\d+)?$/.test(text)) return Math.max(0, Math.ceil(Number(text.replace(',', '.')) - 0.5));
    let minutes = 0;
    let found = false;
    for (const match of text.matchAll(/(\d+(?:[.,]\d+)?)\s*(days?|d\b|hours?|hrs?|h\b|minutes?|mins?|m\b)/gi)) {
      const unit = match[2].toLowerCase();
      minutes += Number(match[1].replace(',', '.')) * (unit.startsWith('d') ? 1440 : unit.startsWith('h') ? 60 : 1);
      found = true;
    }
    return found ? Math.max(0, Math.ceil(minutes / 1440 - 0.5)) : null;
  }

  function extractTransitDays(lines) {
    const value = labeledValue(lines, /^(?:(?:Est\.?|Estimated)\s+)?(?:Transit\s+(?:Time|Days)|Transportation\s+Days)\s*:?\s*(.*)$/i);
    return transitDaysFromValue(value);
  }

  function hapagPort(lines, role) {
    const pattern = role === 'pol' ? /^Terminal\s*\/\s*Ramp\s*\(PoL\)\s*:?\s*(.*)$/i : /^Terminal\s*\/\s*Ramp\s*\(PoD\)\s*:?\s*(.*)$/i;
    for (let i = 0; i < lines.length; i++) {
      const match = lines[i].match(pattern);
      if (!match) continue;
      if (match[1]) return match[1];
      // Hapag repeats these fields with the label after the location in the footer.
      if (/^(From|To)$/i.test(lines[i - 2] || '')) return lines[i - 1];
      const next = lines[i + 1] || '';
      if (next && !/^(From|To|Terminal|Estimated|Quick Quotes)\b/i.test(next)) return next;
    }
    return '';
  }

  function maerskPorts(lines) {
    const start = lines.findIndex(line => /^(?:vessel-front\s*)?Route details$/i.test(line));
    if (start < 0) return { pol: '', pod: '' };
    const end = lines.findIndex((line, index) => index > start && /^Maersk Spot|^Breakdown$/i.test(line));
    const route = lines.slice(start + 1, end < 0 ? undefined : end);
    const icon = /^(?:pin|vessel-front|clock(?:-[a-z]+)?)$/i;
    const pol = route.find(line => !icon.test(line)) || '';
    let pod = '';
    // The final arrival is the POD, also when the route lists intermediate calls.
    for (let i = route.length - 1; i >= 0; i--) {
      if (!/^Arrival$/i.test(route[i])) continue;
      let before = i - 1;
      while (before >= 0 && icon.test(route[before])) before--;
      // Route location blocks list the port, then its terminal, then the arrival marker.
      if (before >= 1) pod = route[before - 1];
      break;
    }
    return { pol, pod };
  }

  function extractMetadata(lines, format, fixedContainerType = '') {
    let ports = { pol: '', pod: '' };
    let transitLines = lines;
    if (format === 'MSC') {
      const selected = selectedMscEquipment(lines);
      if (selected.index >= 0) transitLines = lines.slice(selected.index);
      ports.pol = labeledValue(lines, /^From\s*:\s*(.*)$/i) || labeledValue(lines, /^Port of Load(?:ing)?\s*:?\s*(.*)$/i);
      ports.pod = labeledValue(lines, /^To\s*:\s*(.*)$/i) || labeledValue(lines, /^Port of Discharge\s*:?\s*(.*)$/i);
    } else if (format === 'Maersk') {
      ports = maerskPorts(lines);
    } else if (format === 'Hapag-Lloyd') {
      ports = { pol: hapagPort(lines, 'pol'), pod: hapagPort(lines, 'pod') };
    }
    return { ...ports, equipmentType: fixedContainerType, transitDays: extractTransitDays(transitLines) };
  }

  function formatTransit(days) {
    return Number.isFinite(days) ? `${days} ${days === 1 ? 'dag' : 'dagar'}` : '—';
  }

  function renderMetadata(metadata = {}) {
    polValueEl.textContent = metadata.pol || '—';
    podValueEl.textContent = metadata.pod || '—';
    transitValueEl.textContent = formatTransit(metadata.transitDays);
  }

  function detectAndParse(text) {
    const lines = cleanLines(normalizePastedText(text));
    const looksOOCL = lines.some(l => /^Ocean Freight\s*:/i.test(l))
      && (lines.some(l => /\bPer\s*20ft\b/i.test(l)) || lines.some(l => /^Ocean Surcharges\s*:/i.test(l)));
    const looksMaersk = !looksOOCL && lines.some(l => /^Freight charges\b/i.test(l)) && lines.some(l => /^Origin charges\b/i.test(l)) && lines.some(l => /^Destination charges\b/i.test(l));
    const looksF2 = !looksOOCL && !looksMaersk && lines.some(l => /^Ocean Freight/i.test(l)) && lines.some(l => /\t/.test(l) || /ctr\. type irrelevant/i.test(l) || /^Show Total Price Estimate Details$/i.test(l));
    let result;
    if (looksOOCL) result = { format: 'OOCL', rows: parseFormat4(lines), fixedContainerType: '', supportsAllTypes: true };
    else if (looksMaersk) result = { format: 'Maersk', rows: parseFormat3(lines), fixedContainerType: detectMaerskContainerType(lines), supportsAllTypes: false };
    else if (looksF2) result = { format: 'Hapag-Lloyd', rows: parseFormat2(lines), fixedContainerType: '', supportsAllTypes: true };
    else result = { format: 'MSC', rows: parseFormat1(lines), fixedContainerType: detectMscContainerType(lines), supportsAllTypes: false };
    result.metadata = extractMetadata(lines, result.format, result.fixedContainerType);
    return result;
  }

  function makeRowKey(row, index) {
    return [
      row.format || '', row.category || '', row.charge || '', row.level || '', row.currency || '',
      row.amount20 ?? '', row.amount40 ?? '', row.amount40hc ?? '', index
    ].join('|');
  }

  function assignRowKeys(rows) {
    rows.forEach((row, index) => {
      row._key = makeRowKey(row, index);
    });
  }

  function includeSettings() {
    return {
      freight: includeFreightEl ? includeFreightEl.checked : true,
      origin: includeOriginEl ? includeOriginEl.checked : true,
      destination: includeDestinationEl ? includeDestinationEl.checked : false
    };
  }

  function isGroupSelected(group) {
    const settings = includeSettings();
    return Boolean(settings[group]);
  }

  function groupDisplayName(group) {
    return ({ freight: 'Freight', origin: 'Origin', destination: 'Destination' })[group] || String(group || '');
  }

  function selectedGroupsLabel() {
    const selected = ['freight', 'origin', 'destination']
      .filter(isGroupSelected)
      .map(groupDisplayName);
    return selected.length ? selected.join(' + ') : 'Inga grupper valda';
  }

  function rowCostGroup(row) {
    const category = String(row.category || '');
    const charge = String(row.charge || '');
    if (row.format === 'Hapag-Lloyd' && isHapagTransportAdditionalOrigin(charge)) return 'freight';
    if (/^Additional$/i.test(category)) return 'additional';
    if (/\bDestination\b|\bDest\.?\b|Last\s+Discharge/i.test(charge)) return 'destination';
    if (/\bOrigin\b|\bOrig\.?\b/i.test(charge)) return 'origin';
    if (/Import\s*Surcharges?|^Destination charges$/i.test(category)) return 'destination';
    if (/Export\s*Surcharges?|^Origin charges$/i.test(category)) return 'origin';
    if (/Freight\s*Charges?|Freight\s*Surcharges?|^Freight charges$/i.test(category)) return 'freight';
    return 'freight';
  }

  function getQty(row) {
    const eq = Math.max(0, Number(equipmentQtyEl.value || 1));
    const bl = Math.max(0, Number(blQtyEl.value || 1));
    if (/bill of lading/i.test(row.level) || /^BL$/i.test(row.unit)) return bl;
    return eq;
  }

  function selectedAmount(row, typeOverride) {
    const type = typeOverride || containerTypeEl.value;
    if (type === '20STD') return row.amount20;
    if (type === '40STD') return row.amount40;
    return row.amount40hc;
  }

  function money(n) { return Number(n || 0).toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  function automaticRowRule(row) {
    const charge = String(row.charge || '');
    const category = String(row.category || '');
    if (/heavy\s*lift\s*charge|gross\s*weight\s*\(?VGM\)?|Between\s+[\d.,]+\s+and\s+[\d.,]+\s+ton/i.test(charge)) return { bucket: 'excluded', reason: 'Heavy Lift Charge exkluderas alltid' };
    if (/\(DOC\)/i.test(charge) || /^documentation\s*fee\s*\(DOC\)$/i.test(charge)) return { bucket: 'additional', reason: 'Documentation fee/DOC visas som Additional' };
    if (/^documentation\s*fee\s*origin$/i.test(charge)) return { bucket: 'additional', reason: 'Documentation Fee Origin visas som Additional' };
    if (/^document\s*charge$/i.test(charge) || /\bDocument\s*Charge\b/i.test(charge)) return { bucket: 'additional', reason: 'Document Charge visas som Additional' };
    if (/^outbound\s+documentation\s+fee$/i.test(charge)) return { bucket: 'additional', reason: 'Outbound Documentation Fee visas som Additional' };
    if (/^Additional$/i.test(category)) return { bucket: 'additional', reason: 'Additional visas separat' };
    const group = rowCostGroup(row);
    if (group === 'additional') return { bucket: 'additional', reason: 'Additional visas separat' };
    if (!isGroupSelected(group)) return { bucket: 'excluded', reason: `${groupDisplayName(group)} exkluderad via panel` };
    return { bucket: 'included', reason: '' };
  }

  function rowRule(row) {
    const manualBucket = row._key ? manualBucketOverrides[row._key] : '';
    if (manualBucket === 'included' || manualBucket === 'excluded') {
      return {
        bucket: manualBucket,
        reason: manualBucket === 'included' ? 'Manuellt inkluderad' : 'Manuellt exkluderad',
        manual: true
      };
    }
    return automaticRowRule(row);
  }

  function getRatesToSek() {
    const out = {};
    Object.keys(rateInputs).forEach(cur => {
      out[cur] = Number(rateInputs[cur].value || 0);
    });
    out.SEK = 1;
    return out;
  }

  function renderRateInputs(rates, preservePrecision = false) {
    rateGridEl.innerHTML = '';
    Object.keys(rateInputs).forEach(k => delete rateInputs[k]);
    isoCurrencies.forEach(cur => {
      const wrap = document.createElement('div');
      const label = document.createElement('label');
      label.textContent = cur;
      label.setAttribute('for', 'roe_' + cur);
      const inputEl = document.createElement('input');
      inputEl.id = 'roe_' + cur;
      inputEl.type = 'number';
      inputEl.step = '0.0001';
      const decimals = ['IDR','VND','COP'].includes(cur) ? 6 : 4;
      const rate = Number(rates[cur] ?? defaultRatesToSek[cur] ?? 0);
      inputEl.value = preservePrecision && rate !== Number(rate.toFixed(decimals))
        ? String(rate) : rate.toFixed(decimals);
      inputEl.addEventListener('input', () => {
        ratesRevision++;
        rateMetaEl.textContent = 'Manuellt justerad ROE';
        if (currentRows.length) recalc();
      });
      wrap.appendChild(label);
      wrap.appendChild(inputEl);
      rateGridEl.appendChild(wrap);
      rateInputs[cur] = inputEl;
    });
  }

  function convert(amount, from, to) {
    const rates = getRatesToSek();
    const fromRate = rates[from] || 0;
    const toRate = rates[to] || 0;
    if (!fromRate || !toRate) return NaN;
    return amount * fromRate / toRate;
  }

  function addTotals(target, row, amount) {
    const qty = getQty(row);
    target[row.currency] ||= 0;
    target[row.currency] += amount * qty;
  }

  function isFreightRow(row) {
    const category = String(row.category || '');
    return /Freight/i.test(category);
  }

  function totalsByCurrency(rows, type) {
    const byCurrency = {};
    const valueSek = {};
    let totalSek = 0;
    rows.forEach(r => {
      const rowTotal = selectedAmount(r, type) * getQty(r);
      byCurrency[r.currency] = (byCurrency[r.currency] || 0) + rowTotal;
      const sek = convert(rowTotal, r.currency, 'SEK');
      if (!isNaN(sek)) {
        valueSek[r.currency] = (valueSek[r.currency] || 0) + sek;
        totalSek += sek;
      }
    });
    return { byCurrency, valueSek, totalSek };
  }

  function dominantCurrencyAndConvertedTotal(included, type) {
    const allTotals = totalsByCurrency(included, type);
    const freightRows = included.filter(isFreightRow);
    const freightTotals = totalsByCurrency(freightRows.length ? freightRows : included, type);
    let target = Object.keys(freightTotals.valueSek).sort((a, b) => freightTotals.valueSek[b] - freightTotals.valueSek[a])[0]
      || Object.keys(freightTotals.byCurrency)[0]
      || Object.keys(allTotals.byCurrency)[0]
      || 'SEK';
    const totalInTarget = target === 'SEK' ? allTotals.totalSek : allTotals.totalSek / (getRatesToSek()[target] || 1);
    return { target, totalInTarget, byCurrency: allTotals.byCurrency, valueSek: allTotals.valueSek, targetSource: 'freight' };
  }

  function calculateBuckets(rows) {
    const type = containerTypeEl.value;
    const buckets = { included: [], additional: [], excluded: [] };
    rows.forEach(r => {
      const rule = rowRule(r);
      r._bucket = rule.bucket;
      r._reason = rule.reason;
      r._manual = Boolean(rule.manual);
      buckets[rule.bucket].push(r);
    });

    const additionalTotals = {};
    const excludedTotals = {};
    if (type === 'ALL') {
      ['additional', 'excluded'].forEach(bucket => {
        const store = bucket === 'additional' ? additionalTotals : excludedTotals;
        buckets[bucket].forEach(r => {
          const qty = getQty(r);
          store[r.currency] ||= { amount20: 0, amount40: 0, amount40hc: 0 };
          store[r.currency].amount20 += (r.amount20 || 0) * qty;
          store[r.currency].amount40 += (r.amount40 || 0) * qty;
          store[r.currency].amount40hc += (r.amount40hc || 0) * qty;
        });
      });
      const mainAll = {};
      ['20STD', '40STD', '40HC'].forEach(t => { mainAll[t] = dominantCurrencyAndConvertedTotal(buckets.included, t); });
      return { buckets, mainAll, additionalTotals, excludedTotals };
    }

    buckets.additional.forEach(r => addTotals(additionalTotals, r, selectedAmount(r)));
    buckets.excluded.forEach(r => addTotals(excludedTotals, r, selectedAmount(r)));
    const main = dominantCurrencyAndConvertedTotal(buckets.included, type);
    return { buckets, main, additionalTotals, excludedTotals };
  }

  function renderCurrencyTotals(title, totals, cssClass, note) {
    const keys = Object.keys(totals).sort();
    if (!keys.length) return '';
    const type = containerTypeEl.value;
    const lines = keys.map(cur => {
      const t = totals[cur];
      if (type === 'ALL' && typeof t === 'object') return `<div><strong>${cur}</strong>: 20STD ${money(t.amount20)} / 40STD ${money(t.amount40)} / 40HC ${money(t.amount40hc)}</div>`;
      return `<div><strong>${cur}</strong>: ${money(t)}</div>`;
    }).join('');
    return `<div class="totalbox ${cssClass}"><small>${escapeHtml(title)}</small>${lines}<p class="note">${escapeHtml(note || '')}</p></div>`;
  }

  function renderTotals(calc) {
    if (!currentRows.length) {
      totalsEl.innerHTML = '<p class="note"></p>';
      return;
    }
    const type = containerTypeEl.value;
    let html = '';
    if (type === 'ALL') {
      html += '<div class="totalbox main"><small>Huvudsumma</small>';
      ['20STD', '40STD', '40HC'].forEach(t => {
        const m = calc.mainAll[t];
        html += `<strong>${t}: ${money(m.totalInTarget)} ${escapeHtml(m.target)}</strong>`;
      });
      html += `<p class="note">${selectedGroupsLabel()}</p></div>`;
    } else {
      const m = calc.main;
      html += `<div class="totalbox main"><small>Huvudsumma ${type}</small><strong>${money(m.totalInTarget)} ${escapeHtml(m.target)}</strong><p class="note">${selectedGroupsLabel()}</p></div>`;
      html += renderCurrencyTotals('Originalvaluta', m.byCurrency, '', '');
    }
    html += renderCurrencyTotals('Additional', calc.additionalTotals, 'additional', '');
    html += renderCurrencyTotals('Exkluderat', calc.excludedTotals, 'excluded', '');
    totalsEl.innerHTML = html;
  }

  function renderTable(rows) {
    if (!rows.length) {
      tableEl.innerHTML = '<table><tbody><tr><td>Inga rader kunde tolkas.</td></tr></tbody></table>';
      return;
    }
    const type = containerTypeEl.value;
    const showAll = type === 'ALL';
    let html = '<table><thead><tr>' +
      '<th>Status</th><th>Kategori</th><th>Charge</th><th>Unit/Level</th><th>Valuta</th>';
    if (showAll) html += '<th class="num">20STD</th><th class="num">40STD</th><th class="num">40HC</th>';
    else html += `<th class="num">Pris ${type}</th><th class="num">Antal</th><th class="num">Radtotal</th>`;
    html += '<th>Kommentar</th></tr></thead><tbody>';
    rows.forEach(r => {
      const qty = getQty(r);
      const bucket = r._bucket || rowRule(r).bucket;
      const reason = r._reason || rowRule(r).reason;
      const rowClass = bucket === 'included' ? '' : bucket + '-row';
      const status = bucket === 'included' ? 'Ingår' : bucket === 'additional' ? 'Additional' : 'Exkluderad';
      const manualClass = r._manual ? ' manual' : '';
      const statusTitle = r._manual ? 'Manuellt ändrad. Klicka för att växla Ingår/Exkluderad.' : 'Klicka för att växla Ingår/Exkluderad.';
      html += `<tr class="${rowClass}">` +
        `<td><button type="button" class="pill status-pill ${bucket === 'included' ? '' : bucket}${manualClass}" data-row-key="${escapeHtml(r._key)}" title="${escapeHtml(statusTitle)}">${escapeHtml(status)}</button></td>` +
        `<td><span class="pill">${escapeHtml(r.category)}</span></td>` +
        `<td>${escapeHtml(r.charge)}</td>` +
        `<td>${escapeHtml(r.level)}</td>` +
        `<td>${escapeHtml(r.currency)}</td>`;
      if (showAll) {
        html += `<td class="num">${money(r.amount20)}</td><td class="num">${money(r.amount40)}</td><td class="num">${money(r.amount40hc)}</td>`;
      } else {
        const a = selectedAmount(r);
        html += `<td class="num">${money(a)}</td><td class="num">${qty}</td><td class="num">${money(a * qty)}</td>`;
      }
      const comment = [r.comment || '', reason || ''].filter(Boolean).join(' | ');
      html += `<td>${escapeHtml(comment)}</td></tr>`;
    });
    html += '</tbody></table>';
    tableEl.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  }

  function spotRateLabelForResult(result) {
    if (!result || !result.rows || !result.rows.length) return '';
    const base = result.format === 'MSC' ? 'MSC Spot Rate'
      : result.format === 'Hapag-Lloyd' ? 'Hapag-Lloyd Spot Rate'
      : result.format === 'Maersk' ? 'Maersk Spot Rate'
      : result.format === 'OOCL' ? 'OOCL Spot Rate'
      : '';
    if (!base) return '';
    if (result.supportsAllTypes) return `${base} · 20STD / 40STD / 40HC`;
    return result.fixedContainerType ? `${base} · ${result.fixedContainerType}` : base;
  }

  function setInputReplaced(isReplaced) {
    input.classList.toggle('is-replaced-by-label', Boolean(isReplaced));
  }

  function applyContainerTypeLock(result) {
    if (!result || !result.rows || !result.rows.length) {
      containerTypeEl.disabled = false;
      return;
    }
    if (result.supportsAllTypes) {
  containerTypeEl.disabled = false;
  if (!['20STD', '40STD', '40HC', 'ALL'].includes(containerTypeEl.value)) {
    containerTypeEl.value = 'ALL';
  }
  return;
}
    if (result.fixedContainerType) {
      containerTypeEl.value = result.fixedContainerType;
      containerTypeEl.disabled = true;
      return;
    }
    containerTypeEl.disabled = false;
  }

  function updateRateLabel(result) {
    const text = input.value.trim();
    if (!text) {
      rateLabelEl.textContent = '';
      rateLabelEl.classList.remove('is-visible');
      setInputReplaced(false);
      return;
    }
    result = result || detectAndParse(text);
    const label = spotRateLabelForResult(result);
    rateLabelEl.textContent = label;
    rateLabelEl.classList.toggle('is-visible', Boolean(label));
    setInputReplaced(Boolean(label));
  }

  function readHistoryEntries() {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (!raw) return [];
    const saved = JSON.parse(raw);
    if (saved.version !== 1 || !Array.isArray(saved.entries) || !saved.entries.every(entry =>
      entry && typeof entry.id === 'string' && typeof entry.text === 'string' &&
      typeof entry.note === 'string' && Number.isFinite(Date.parse(entry.createdAt)) &&
      entry.settings && ['20STD', '40STD', '40HC', 'ALL'].includes(entry.settings.containerType) &&
      entry.rates && entry.overrides && typeof entry.summary === 'string'
    )) throw new Error('Invalid history');
    return saved.entries;
  }

  function historyError(message) {
    historyStatusEl.className = 'compact-note err';
    historyStatusEl.textContent = message;
    saveStatusEl.className = 'compact-note err';
    saveStatusEl.textContent = 'Ej sparad lokalt';
  }

  function formatCheckDate(value) {
    return new Date(value).toLocaleString('sv-SE', {
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }

  function renderHistory() {
    historyCountEl.textContent = String(historyEntries.length);
    historyBodyEl.innerHTML = historyEntries.length ? [...historyEntries]
      .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt))
      .map(entry => {
        if (!metadataCache.has(entry.text)) metadataCache.set(entry.text, detectAndParse(entry.text).metadata);
        const metadata = metadataCache.get(entry.text);
        return `<tr${entry.id === activeCheckId ? ' class="is-active"' : ''}>
        <td><time datetime="${escapeHtml(entry.createdAt)}">${escapeHtml(formatCheckDate(entry.createdAt))}</time></td>
        <td>${escapeHtml(entry.format)}</td>
        <td data-column="pol">${escapeHtml(metadata.pol || '—')}</td>
        <td data-column="pod">${escapeHtml(metadata.pod || '—')}</td>
        <td data-column="equipment">${escapeHtml(metadata.equipmentType || entry.settings.containerType)}</td>
        <td class="num">${escapeHtml(entry.settings.equipmentQty)}</td>
        <td data-column="transit">${escapeHtml(formatTransit(metadata.transitDays))}</td>
        <td class="history-total">${escapeHtml(entry.summary)}</td>
        <td class="history-note">${escapeHtml(entry.note)}</td>
        <td><button type="button" data-open-check="${escapeHtml(entry.id)}">Öppna</button></td>
      </tr>`;
      }).join('') : '<tr><td colspan="10">Inga sparade checkar.</td></tr>';
  }

  function loadHistory() {
    try {
      historyEntries = readHistoryEntries();
      historyStatusEl.textContent = '';
    } catch (e) {
      historyError('Historiken kunde inte läsas. Befintlig historik skrivs inte över.');
    }
    renderHistory();
  }

  function saveCurrentCheck() {
    if (!currentRows.length || !input.value.trim() || input.value.trim() !== activeCheckText) return;
    try {
      // Merge with the latest storage so checks from another tab are retained.
      const entries = readHistoryEntries();
      const previous = entries.find(entry => entry.id === activeCheckId);
      const calc = calculateBuckets(currentRows);
      const summary = containerTypeEl.value === 'ALL'
        ? ['20STD', '40STD', '40HC'].map(type => `${type}: ${money(calc.mainAll[type].totalInTarget)} ${calc.mainAll[type].target}`).join('\n')
        : `${money(calc.main.totalInTarget)} ${calc.main.target}`;
      const entry = {
        id: activeCheckId || (globalThis.crypto?.randomUUID?.() || `check-${Date.now()}-${Math.random().toString(36).slice(2)}`),
        createdAt: previous?.createdAt || new Date().toISOString(),
        appVersion: '3.1.0',
        text: input.value,
        note: rateNoteEl.value,
        format: lastFormat,
        metadata: { ...currentMetadata },
        settings: {
          containerType: containerTypeEl.value,
          equipmentQty: equipmentQtyEl.value,
          blQty: blQtyEl.value,
          ...includeSettings()
        },
        rates: getRatesToSek(),
        rateMeta: rateMetaEl.textContent,
        overrides: { ...manualBucketOverrides },
        summary
      };
      const index = entries.findIndex(item => item.id === entry.id);
      if (index < 0) entries.unshift(entry);
      else entries[index] = entry;
      localStorage.setItem(HISTORY_KEY, JSON.stringify({ version: 1, entries }));
      activeCheckId = entry.id;
      historyEntries = entries;
      saveStatusEl.className = 'compact-note';
      saveStatusEl.textContent = `Sparad lokalt · ${formatCheckDate(entry.createdAt)}`;
      historyStatusEl.textContent = '';
      renderHistory();
    } catch (e) {
      historyError('Checken kunde inte sparas lokalt. Lagringen kan vara full, blockerad eller innehålla oläsbar historik.');
    }
  }

  function openHistoryCheck(id) {
    const entry = historyEntries.find(item => item.id === id);
    if (!entry) return;
    // Show saved rates while fetching today's rates for this reopened check.
    ratesRevision++;
    activeCheckId = entry.id;
    activeCheckText = entry.text.trim();
    input.value = entry.text;
    rateNoteEl.value = entry.note;
    containerTypeEl.value = entry.settings.containerType;
    equipmentQtyEl.value = entry.settings.equipmentQty;
    blQtyEl.value = entry.settings.blQty;
    includeFreightEl.checked = entry.settings.freight;
    includeOriginEl.checked = entry.settings.origin;
    includeDestinationEl.checked = entry.settings.destination;
    manualBucketOverrides = { ...entry.overrides };
    lastInputForOverrides = activeCheckText;
    renderRateInputs(entry.rates, true);
    rateMetaEl.textContent = entry.rateMeta || '';
    recalc({ save: false });
    saveStatusEl.className = 'compact-note';
    saveStatusEl.textContent = `Sparad lokalt · ${formatCheckDate(entry.createdAt)}`;
    renderHistory();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    fetchRates();
  }

  function syncCheckText(text) {
    if (text === activeCheckText) return;
    if (activeCheckText) rateNoteEl.value = '';
    activeCheckId = null;
    activeCheckText = text;
    saveStatusEl.textContent = '';
  }

  function recalc(options = {}) {
    const text = input.value.trim();
    syncCheckText(text);
    if (!text) {
      currentMetadata = { pol: '', pod: '', transitDays: null };
      renderMetadata(currentMetadata);
      currentRows = [];
      manualBucketOverrides = {};
      lastInputForOverrides = '';
      statusEl.className = 'status err';
      statusEl.textContent = 'Klistra in pristext.';
      renderTotals({});
      renderTable([]);
      return;
    }
    if (text !== lastInputForOverrides) {
      manualBucketOverrides = {};
      lastInputForOverrides = text;
    }
    const result = detectAndParse(text);
    currentMetadata = result.metadata;
    renderMetadata(currentMetadata);
    lastFormat = result.format;
    currentRows = result.rows;
    assignRowKeys(currentRows);
    if (!currentRows.length) {
      updateRateLabel(result);
      applyContainerTypeLock(result);
      statusEl.className = 'status err';
      statusEl.textContent = 'Kunde inte tolka texten.';
      renderTotals({});
      renderTable([]);
      return;
    }
    applyContainerTypeLock(result);
    updateRateLabel(result);
    const calc = calculateBuckets(currentRows);
    const included = calc.buckets.included.length;
    const additional = calc.buckets.additional.length;
    const excluded = calc.buckets.excluded.length;
    statusEl.className = 'status ok';
    const typeNote = result.supportsAllTypes ? 'Alla containertyper.' : (result.fixedContainerType ? `Containertyp låst till ${result.fixedContainerType}.` : 'Containertyp ej låst.');
    statusEl.textContent = `${result.format}: ${currentRows.length} rader. Ingår ${included}. Additional ${additional}. Exkluderade ${excluded}. ${typeNote} Valda grupper: ${selectedGroupsLabel()}.`;
    renderTotals(calc);
    renderTable(currentRows);
    if (options.save !== false) saveCurrentCheck();
  }

  async function fetchRates() {
    const requestRevision = ++ratesRevision;
    if (ratesController) ratesController.abort();
    const controller = new AbortController();
    ratesController = controller;
    const timeout = setTimeout(() => controller.abort(), 15000);
    ratesBtn.disabled = true;
    ratesBtn.textContent = 'Hämtar...';
    rateMetaEl.textContent = 'Hämtar aktuell ROE...';
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/SEK', { cache: 'no-store', signal: controller.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (requestRevision !== ratesRevision) return;
      if (!data || !data.rates) throw new Error('Felaktigt svar');
      const sekPer = { SEK: 1 };
      isoCurrencies.forEach(cur => {
        if (cur === 'SEK') return;
        if (data.rates[cur]) sekPer[cur] = 1 / data.rates[cur];
      });
      renderRateInputs({ ...defaultRatesToSek, ...sekPer });
      rateMetaEl.textContent = data.time_last_update_utc || '';
      statusEl.className = 'status ok';
      statusEl.textContent = 'ROE hämtad';
      if (currentRows.length) recalc();
    } catch (e) {
      if (requestRevision !== ratesRevision) return;
      statusEl.className = 'status warn';
      statusEl.textContent = 'ROE ej hämtad. Befintliga kurser behålls.';
      rateMetaEl.textContent = 'ROE ej uppdaterad. Befintliga kurser används.';
    } finally {
      clearTimeout(timeout);
      if (ratesController === controller) {
        ratesController = null;
        ratesBtn.disabled = false;
        ratesBtn.textContent = 'Hämta ROE';
      }
    }
  }

  function rowsToCsv(rows) {
    const type = containerTypeEl.value;
    const header = type === 'ALL'
      ? ['Status','Kategori','Charge','Unit/Level','Valuta','20STD','40STD','40HC','Kommentar']
      : ['Status','Kategori','Charge','Unit/Level','Valuta',`Pris ${type}`,'Antal','Radtotal','Kommentar'];
    const lines = [header];
    rows.forEach(r => {
      const rule = rowRule(r);
      const status = rule.bucket === 'included' ? 'Ingår' : rule.bucket === 'additional' ? 'Additional' : 'Exkluderad';
      const qty = getQty(r);
      const comment = [r.comment || '', rule.reason || ''].filter(Boolean).join(' | ');
      if (type === 'ALL') lines.push([status, r.category, r.charge, r.level, r.currency, r.amount20, r.amount40, r.amount40hc, comment]);
      else {
        const a = selectedAmount(r);
        lines.push([status, r.category, r.charge, r.level, r.currency, a, qty, a * qty, comment]);
      }
    });
    return lines.map(cols => cols.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
  }

  input.addEventListener('input', () => {
    syncCheckText(input.value.trim());
    if (input.value.trim()) recalc();
    else {
      currentMetadata = { pol: '', pod: '', transitDays: null };
      renderMetadata(currentMetadata);
      currentRows = [];
      manualBucketOverrides = {};
      lastInputForOverrides = '';
      updateRateLabel();
      applyContainerTypeLock(null);
      statusEl.textContent = '';
      renderTotals({});
      renderTable([]);
      renderHistory();
    }
  });
  rateLabelEl.addEventListener('click', () => {
    setInputReplaced(false);
    input.focus();
  });
  rateLabelEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setInputReplaced(false);
      input.focus();
    }
  });

  function toggleManualBucket(rowKey) {
    if (!rowKey) return;
    const row = currentRows.find(r => r._key === rowKey);
    if (!row) return;
    const currentBucket = row._bucket || rowRule(row).bucket;
    manualBucketOverrides[rowKey] = currentBucket === 'included' ? 'excluded' : 'included';
    recalc();
  }

  tableEl.addEventListener('click', e => {
    const pill = e.target.closest('.status-pill[data-row-key]');
    if (!pill) return;
    toggleManualBucket(pill.dataset.rowKey);
  });
  tableEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const pill = e.target.closest('.status-pill[data-row-key]');
    if (!pill) return;
    e.preventDefault();
    toggleManualBucket(pill.dataset.rowKey);
  });

  calcBtn.addEventListener('click', recalc);
  rateNoteEl.addEventListener('input', saveCurrentCheck);
  historyBodyEl.addEventListener('click', e => {
    const button = e.target.closest('button[data-open-check]');
    if (button) openHistoryCheck(button.dataset.openCheck);
  });
  window.addEventListener('storage', e => {
    if (e.key === HISTORY_KEY) loadHistory();
  });
  ratesBtn.addEventListener('click', fetchRates);
  [includeFreightEl, includeOriginEl, includeDestinationEl]
    .filter(Boolean)
    .forEach(el => el.addEventListener('change', () => currentRows.length && recalc()));
  containerTypeEl.addEventListener('change', () => currentRows.length && recalc());
  equipmentQtyEl.addEventListener('input', () => currentRows.length && recalc());
  blQtyEl.addEventListener('input', () => currentRows.length && recalc());
  clearBtn.addEventListener('click', () => {
    currentMetadata = { pol: '', pod: '', transitDays: null };
    renderMetadata(currentMetadata);
    activeCheckId = null;
    activeCheckText = '';
    rateNoteEl.value = '';
    saveStatusEl.textContent = '';
    input.value = '';
    currentRows = [];
    lastFormat = '';
    manualBucketOverrides = {};
    lastInputForOverrides = '';
    if (includeFreightEl) includeFreightEl.checked = true;
    if (includeOriginEl) includeOriginEl.checked = true;
    if (includeDestinationEl) includeDestinationEl.checked = false;
    containerTypeEl.disabled = false;
    setInputReplaced(false);
    rateLabelEl.textContent = '';
    rateLabelEl.classList.remove('is-visible');
    statusEl.textContent = '';
    renderTotals({});
    renderTable([]);
    renderHistory();
  });
  copyCsvBtn.addEventListener('click', async () => {
    if (!currentRows.length) { recalc(); if (!currentRows.length) return; }
    const csv = rowsToCsv(currentRows);
    try {
      await navigator.clipboard.writeText(csv);
      statusEl.className = 'status ok';
      statusEl.textContent = 'CSV kopierad.';
    } catch (e) {
      statusEl.className = 'status err';
      statusEl.textContent = 'CSV ej kopierad.';
    }
  });

  renderRateInputs(defaultRatesToSek);
  rateMetaEl.textContent = 'Förinställd ROE';
  loadHistory();
  fetchRates();
})();
</script>
</body>
</html>
